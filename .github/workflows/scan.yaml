name: Scan

on:
  schedule:
    # hourly, off the top of the hour
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: Only scan the packages of these repositories, e.g. `componentized/valkey`, or else all
        type: string
        required: false
      version:
        description: Only scan this version of their packages, e.g. `0.3.1`
        type: string
        required: false
  # a release workflow can ask for a scan of the version it just published, e.g.
  # `gh api repos/componentized/directory/dispatches -f event_type=release -f 'client_payload[only]=componentized/valkey' -f 'client_payload[version]=0.3.1'`
  # `only` is a repository, e.g. `componentized/valkey` or `valkey`, or a space separated list of them, and `version` needs `only`; without
  # them, it's a full scan
  repository_dispatch:
    types:
      - release

# commits the new versions as the componentized custodian GitHub App, from
# secrets.CUSTODIAN_CLIENT_ID and secrets.CUSTODIAN_PRIVATE_KEY
permissions: {}

# runs queue
concurrency:
  group: scan
  cancel-in-progress: false
  queue: max

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      # the index is committed by the custodian app, this job's token only reads
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Scan
        id: scan
        # without pipefail, the step would take tee's status and pass when the scan fails
        run: |
          set -o pipefail
          args=()
          for repo in ${ONLY//,/ } ; do
            if ! [[ "${repo}" =~ ^([A-Za-z0-9._-]+/)?([A-Za-z0-9._-]+)$ ]] ; then
              echo "::error::'${repo}' is not a repository, e.g. ${OWNER}/valkey"
              exit 1
            fi
            # the scan's packages are the org's, a repository of another owner has none
            if [ -n "${BASH_REMATCH[1]}" ] && [ "${BASH_REMATCH[1],,}" != "${OWNER,,}/" ] ; then
              echo "::error::'${repo}' is not a repository of ${OWNER}"
              exit 1
            fi
            args+=( --only "${BASH_REMATCH[2]}" )
          done
          if [ -n "${VERSION}" ] ; then
            if ! [[ "${VERSION}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-dev)?$ ]] ; then
              echo "::error::'${VERSION}' is not a release or dev version, e.g. 0.3.1"
              exit 1
            fi
            if [ "${#args[@]}" -eq 0 ] ; then
              echo "::error::a version needs the repositories to scan it for, in only"
              exit 1
            fi
            args+=( --version "${VERSION}" )
          fi
          cargo run --release --locked -- scan "${args[@]}" | tee "${RUNNER_TEMP}/added.txt"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          # untrusted, passed through the environment rather than into the script
          ONLY: ${{ github.event.client_payload.only || inputs.only }}
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
      - name: Stage
        id: stage
        run: |
          git add --all
          if git diff --cached --quiet ; then
            echo "no new versions"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Create custodian app token
        id: app-token
        if: steps.stage.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CUSTODIAN_CLIENT_ID }}
          private-key: ${{ secrets.CUSTODIAN_PRIVATE_KEY }}
          # only this repository, with only the permission the commit needs
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      # main requires signed commits, which the custodian app's commits created with the REST API
      # are, and the app bypasses its required checks. A push by the app starts the Pages workflow,
      # which deploys the new index.
      - name: Commit
        if: steps.stage.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          # a run started by hand credits whoever started it as a co-author; a scheduled run, or one
          # a release asked for, credits no one
          GITHUB_ACTOR: ${{ github.event_name == 'workflow_dispatch' && github.actor || '' }}
        run: |
          added=$( grep -v '^::' "${RUNNER_TEMP}/added.txt" || true )
          count=$( printf '%s\n' "${added}" | grep -c . || true )
          if [ "${count}" -gt 0 ] ; then
            {
              echo "Index ${count} new version(s)"
              echo
              printf '%s\n' "${added}" | sed 's/^/- /'
            } > "${RUNNER_TEMP}/message.txt"
          else
            # no new versions, but those indexed changed, e.g. linked to their GitHub releases
            echo "Update the indexed versions" > "${RUNNER_TEMP}/message.txt"
          fi
          base=$( git rev-parse HEAD )
          commit=$( .github/scripts/create-commit.sh "${base}" "$( cat "${RUNNER_TEMP}/message.txt" )" )
          # fast forwards main to the commit, failing rather than losing commits pushed since the
          # scan started
          if ! gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}" -f sha="${commit}" -F force=false --silent ; then
            echo "::error::failed to push ${commit} to ${GITHUB_REF_NAME}, either the branch moved since ${base} and the scan should be run again, or the custodian app is not allowed to bypass the branch's ruleset"
            exit 1
          fi
          echo "pushed ${commit} to ${GITHUB_REF_NAME}"
