name: Scan

on:
  schedule:
    # hourly, off the top of the hour
    - cron: "23 * * * *"
  workflow_dispatch:
  # a release workflow can ask for a scan right away, e.g.
  # `gh api repos/componentized/directory/dispatches -f event_type=release`
  repository_dispatch:
    types:
      - release

permissions: {}

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      # commit the new versions to the index
      contents: write
      # discover the org's packages with the GitHub Packages API
      packages: read
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Scan
        id: scan
        run: |
          cargo run --release --locked -- scan | tee "${RUNNER_TEMP}/added.txt"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit
        id: commit
        run: |
          git add --all
          if git diff --cached --quiet ; then
            echo "no new versions"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          added=$( grep -v '^::' "${RUNNER_TEMP}/added.txt" || true )
          count=$( printf '%s\n' "${added}" | grep -c . || true )
          {
            echo "Index ${count} new version(s)"
            echo
            printf '%s\n' "${added}" | sed 's/^/- /'
          } > "${RUNNER_TEMP}/message.txt"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet --file "${RUNNER_TEMP}/message.txt"
          git push
          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "sha=$( git rev-parse HEAD )" >> "${GITHUB_OUTPUT}"

  # a push with the GITHUB_TOKEN does not start other workflows, deploy the new index from here
  deploy:
    needs: scan
    if: needs.scan.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yaml
    with:
      ref: ${{ needs.scan.outputs.sha }}
