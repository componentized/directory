name: Preview cleanup

# Deletes a PR's Cloudflare Pages previews once the PR is merged or closed.
#
# pull_request_target runs in the context of this repo, so it can read the
# Cloudflare secrets for PRs from forks too. It must never check out or run the
# PR's code: it only uses the PR number from the event.
#
# Needs the same secrets and variable as the Preview workflow, and comments as the custodian app.

on:
  pull_request_target:
    types:
      - closed

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # the custodian app marks the preview comment as removed
    permissions: {}
    steps:
      # the script from the default branch, never the PR's
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      # a deployment still publishing, e.g. of a PR merged as its preview deploys, is tried again
      # until it's done; a preview that starts deploying after this deletes itself, as the Preview
      # workflow checks again that its PR is open once it's deployed
      - name: Delete the PR's deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          BRANCH: pr-${{ github.event.number }}
        run: .github/scripts/delete-previews.sh "$BRANCH"

      - name: Create custodian app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CUSTODIAN_CLIENT_ID }}
          private-key: ${{ secrets.CUSTODIAN_PRIVATE_KEY }}
          # only this repository, with only the permission the comment needs
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: Update the preview comment
        env:
          # the custodian app comments, rather than github-actions
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
        run: |
          marker='<!-- preview -->'
          id="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq "map(select(.user.login == \"$BOT\" and (.body | startswith(\"$marker\")))) | .[0].id // empty" | head -n1)"
          if [[ -n "$id" ]]; then
            body="$(printf '%s\n**Preview:** removed now that this PR is closed.' "$marker")"
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          fi
