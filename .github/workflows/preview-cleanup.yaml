name: Preview cleanup

# Deletes the Cloudflare Pages previews of each merged or closed PR, daily, or when run by hand:
# a preview needn't go the moment its PR closes, so long as it doesn't stay up for good.
#
# It runs on a schedule, in the context of this repo, so it can read the Cloudflare secrets for
# PRs from forks too, with no event from a PR to trust. It never checks out or runs a PR's code:
# it finds the PRs by the branches their previews deploy to, e.g. `pr-42`, and keeps the previews
# of those still open.
#
# Needs the same secrets and variable as the Preview workflow, and comments as the custodian app.

on:
  schedule:
    # daily, off the top of the hour
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions: {}

# one at a time, so a scheduled run and one by hand don't race to delete the same deployments
concurrency:
  group: preview-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      # read the script and the PRs; the custodian app comments
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Find the closed PRs with previews
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          branches="$(.github/scripts/delete-previews.sh --branches)"
          closed=()
          for number in $(sed -n 's/^pr-\([0-9][0-9]*\)$/\1/p' <<< "$branches"); do
            if ! state="$(gh api "repos/$REPO/pulls/$number" --jq .state)"; then
              echo "::warning::Couldn't read PR #$number, keeping its previews"
              continue
            fi
            if [[ "$state" == "closed" ]]; then
              closed+=("$number")
            else
              echo "PR #$number is $state, keeping its previews"
            fi
          done
          echo "Closed PRs with previews: ${closed[*]:-none}"
          echo "numbers=${closed[*]}" >> "$GITHUB_OUTPUT"
          # the repository's name alone, for the app token, which a scheduled run's event doesn't
          # hold
          echo "repository=${REPO#*/}" >> "$GITHUB_OUTPUT"

      # a deployment still publishing is tried again until it's done, or else left for the next run
      - name: Delete the PRs' deployments
        if: steps.prs.outputs.numbers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          NUMBERS: ${{ steps.prs.outputs.numbers }}
        run: |
          failed=0
          for number in $NUMBERS; do
            .github/scripts/delete-previews.sh "pr-$number" || failed=1
          done
          exit "$failed"

      - name: Create custodian app token
        id: app-token
        if: steps.prs.outputs.numbers
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CUSTODIAN_CLIENT_ID }}
          private-key: ${{ secrets.CUSTODIAN_PRIVATE_KEY }}
          # only this repository, with only the permission the comment needs
          repositories: ${{ steps.prs.outputs.repository }}
          permission-pull-requests: write
      - name: Update the preview comments
        if: steps.prs.outputs.numbers
        env:
          # the custodian app comments, rather than github-actions
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
          REPO: ${{ github.repository }}
          NUMBERS: ${{ steps.prs.outputs.numbers }}
        run: |
          marker='<!-- preview -->'
          body="$(printf '%s\n**Preview:** removed now that this PR is closed.' "$marker")"
          for pr in $NUMBERS; do
            id="$(gh api --paginate "repos/$REPO/issues/$pr/comments" \
              --jq "map(select(.user.login == \"$BOT\" and (.body | startswith(\"$marker\")))) | .[0].id // empty" | head -n1)"
            if [[ -n "$id" ]]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
            fi
          done
