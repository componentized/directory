name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Render the index
        run: cargo run --locked -- build --out _site
      # the Preview workflow deploys this site, including for PRs from forks,
      # which can't read the repo's secrets here
      - name: Record the PR for the preview
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: echo "$PR_NUMBER" > _site/.pr-number
      - name: Upload the site for the preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: preview-site
          path: _site
          include-hidden-files: true
          retention-days: 3
